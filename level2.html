  <link rel="stylesheet" href="assets/folio.css?v=20260727-11">
  <script>
    (function () {
      var theme = 'light';
      try {
        if (localStorage.getItem('tajweed_theme') === 'dark') theme = 'dark';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0a0b');
      }
    })();
  </script>
</head>

      </button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">
        <span class="theme-dial" aria-hidden="true"></span>

      </button>
    </div>
